<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  /* KRDS 컬러: Primary #246BEB / Secondary #003675 / Point #E71825 / Gray 스케일 */
  :root {
    --bg: #ffffff; --fg: #1E2124; --muted: #58616A; --line: #E6E8EA;
    --accent: #246BEB; --accent-bg: #ECF2FE; --warn: #E71825; --warn-bg: #FDEFEF;
    --secondary: #003675;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --fg: #e5e7eb; --muted: #9ca3af; --line: #2d3138;
      --accent: #6FA4F4; --accent-bg: #1e2a3f; --warn: #f87171; --warn-bg: #3a2022;
      --secondary: #9DBCE8;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 420px; min-height: 200px; padding: 14px 16px;
    font-family: 'Pretendard GovKR', Pretendard, 'Malgun Gothic', system-ui, sans-serif; font-size: 13px;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    word-break: keep-all; overflow-wrap: break-word;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  header h1 { font-size: 14px; color: var(--secondary); }
  header .btns button {
    border: 1px solid var(--line); background: none; color: var(--muted);
    border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer;
  }
  header .btns button:hover { color: var(--fg); }
  #status { color: var(--muted); padding: 8px 0; }
  #status.error { color: var(--warn); white-space: pre-wrap; word-break: break-all; }
  .badge {
    display: inline-block; background: var(--accent-bg); color: var(--accent);
    border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 12px; margin-bottom: 6px;
  }
  #actPill { margin-left: 6px; }
  #actPill.need { background: var(--warn-bg); color: var(--warn); }
  li b { font-weight: 700; }
  #oneLine { font-weight: 700; font-size: 13.5px; margin-bottom: 10px; }
  #deadline {
    background: var(--accent-bg); color: var(--accent); border-radius: 8px;
    padding: 6px 10px; font-weight: 700; margin-bottom: 10px;
  }
  #deadline.urgent { background: var(--warn-bg); color: var(--warn); }
  section { margin-bottom: 10px; }
  section h2 { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  ul { padding-left: 18px; }
  li { margin-bottom: 3px; }
  .actions li { font-weight: 600; }
  .cautions { background: var(--warn-bg); border-radius: 8px; padding: 8px 10px 8px 8px; }
  .cautions li { color: var(--warn); }
  #notice { background: #fffbeb; color: #b45309; border-radius: 8px; padding: 6px 10px; font-size: 12px; margin-bottom: 8px; }
  @media (prefers-color-scheme: dark) { #notice { background: #3a2f12; color: #fbbf24; } }
  #disclaim { color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; line-height: 1.5; }
  #pasteArea { display: none; }
  #pasteArea textarea {
    width: 100%; height: 140px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--fg); padding: 8px; font: inherit; resize: vertical;
  }
  #pasteArea button {
    margin-top: 6px; border: none; background: var(--accent); color: #fff;
    border-radius: 6px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  #srcBadge {
    margin-left: 7px; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
    background: rgba(18, 183, 106, .12); color: #0E9F6E; white-space: nowrap;
  }
  #srcBadge.ext { background: var(--warn-bg); color: var(--warn); }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>📄 전자문서 AI 요약<span id="srcBadge" class="hidden"></span></h1>
    <div class="btns">
      <button id="copyBtn" title="요약 복사">📋 복사</button>
      <button id="reBtn" title="다시 요약">↻ 다시</button>
      <button id="optBtn" title="설정">⚙ 설정</button>
    </div>
  </header>

  <div id="status">본문 추출 중…</div>

  <div id="pasteArea">
    <textarea id="pasteText" placeholder="본문 자동 추출에 실패했습니다. 전자문서 본문을 복사해 붙여넣으세요."></textarea>
    <button id="pasteBtn">붙여넣은 내용 요약</button>
  </div>

  <div id="result" class="hidden">
    <span class="badge" id="docType"></span><span class="badge" id="actPill"></span>
    <div id="oneLine"></div>
    <div id="deadline" class="hidden"></div>
    <section><h2>핵심 내용</h2><ul id="keyPoints"></ul></section>
    <section id="actionsSec"><h2>조치 사항</h2><ul id="actions" class="actions"></ul></section>
    <section id="cautionsSec" class="cautions"><h2>⚠ 주의</h2><ul id="cautions"></ul></section>
    <div id="notice" class="hidden"></div>
    <div id="disclaim">AI 생성 요약입니다. 기한·금액·문서번호는 원문에서 다시 확인하세요.</div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0A57D0"/><stop offset="0.55" stop-color="#0891B2"/><stop offset="1" stop-color="#00B8A9"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1B33" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="920" height="300" rx="16" fill="#F7F9FC" stroke="#E2E7EF"/>

  <!-- STEP 1: 원클릭 실행 -->
  <rect x="24" y="44" width="200" height="212" rx="14" fill="#FFFFFF" stroke="#E2E7EF" filter="url(#sh)"/>
  <rect x="44" y="64" width="40" height="40" rx="13" fill="url(#g)"/>
  <path d="M64 71l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#FFFFFF"/>
  <circle cx="204" cy="64" r="11" fill="#E7EFFB"/>
  <text x="204" y="68.5" font-size="11" font-weight="750" fill="#0A57D0" text-anchor="middle">1</text>
  <text x="44" y="134" font-size="14.5" font-weight="750" fill="#0B1B33">원클릭 실행</text>
  <g font-size="11.5" fill="#3D4E66">
    <circle cx="49" cy="156" r="2" fill="#0A57D0"/><text x="58" y="160">문서 화면 플로팅 버튼</text>
    <circle cx="49" cy="178" r="2" fill="#0A57D0"/><text x="58" y="182">우클릭 → AI 요약·검토</text>
    <circle cx="49" cy="200" r="2" fill="#0A57D0"/><text x="58" y="204">팝업창(툴바 없음)도 동작</text>
  </g>

  <path d="M258 150l-16-8v5h-10v6h10v5z" fill="#B9C4D6"/>

  <!-- STEP 2: 본문 자동 추출 -->
  <rect x="266" y="44" width="200" height="212" rx="14" fill="#FFFFFF" stroke="#E2E7EF" filter="url(#sh)"/>
  <rect x="286" y="64" width="40" height="40" rx="13" fill="#E7EFFB"/>
  <rect x="297" y="73" width="18" height="23" rx="2" fill="none" stroke="#0A57D0" stroke-width="2"/>
  <line x1="301" y1="80" x2="311" y2="80" stroke="#0A57D0" stroke-width="2"/>
  <line x1="301" y1="86" x2="311" y2="86" stroke="#0A57D0" stroke-width="2"/>
  <circle cx="446" cy="64" r="11" fill="#E7EFFB"/>
  <text x="446" y="68.5" font-size="11" font-weight="750" fill="#0A57D0" text-anchor="middle">2</text>
  <text x="286" y="134" font-size="14.5" font-weight="750" fill="#0B1B33">본문 자동 추출</text>
  <g font-size="11.5" fill="#3D4E66">
    <text x="291" y="160"><tspan font-weight="700" fill="#7C8AA0">①</tspan> 드래그 선택 텍스트</text>
    <text x="291" y="180"><tspan font-weight="700" fill="#7C8AA0">②</tspan> 카드 DOM + HwpCtrl API</text>
    <text x="291" y="200"><tspan font-weight="700" fill="#7C8AA0">③</tspan> 최장 텍스트 프레임</text>
    <text x="291" y="220"><tspan font-weight="700" fill="#7C8AA0">④</tspan> 붙여넣기 폴백</text>
  </g>
  <rect x="286" y="230" width="128" height="18" rx="9" fill="#E6F5F3"/>
  <text x="350" y="243" font-size="10.5" font-weight="700" fill="#0E8074" text-anchor="middle">웹한글 캔버스 대응</text>

  <path d="M500 150l-16-8v5h-10v6h10v5z" fill="#B9C4D6"/>

  <!-- STEP 3: AI 분석 -->
  <rect x="508" y="44" width="200" height="212" rx="14" fill="#FFFFFF" stroke="#E2E7EF" filter="url(#sh)"/>
  <rect x="528" y="64" width="40" height="40" rx="13" fill="#E6F5F3"/>
  <rect x="539" y="75" width="18" height="18" rx="4" fill="none" stroke="#00B8A9" stroke-width="2"/>
  <g stroke="#00B8A9" stroke-width="2">
    <line x1="543" y1="70" x2="543" y2="75"/><line x1="553" y1="70" x2="553" y2="75"/>
    <line x1="543" y1="93" x2="543" y2="98"/><line x1="553" y1="93" x2="553" y2="98"/>
  </g>
  <circle cx="688" cy="64" r="11" fill="#E7EFFB"/>
  <text x="688" y="68.5" font-size="11" font-weight="750" fill="#0A57D0" text-anchor="middle">3</text>
  <text x="528" y="134" font-size="14.5" font-weight="750" fill="#0B1B33">AI 분석</text>
  <g font-size="11.5" fill="#3D4E66">
    <circle cx="533" cy="156" r="2" fill="#00B8A9"/><text x="542" y="160">로컬 Ollama · 내부 LLM · Gemini</text>
    <circle cx="533" cy="178" r="2" fill="#00B8A9"/><text x="542" y="182">SSE 실시간 스트리밍 표시</text>
    <circle cx="533" cy="200" r="2" fill="#00B8A9"/><text x="542" y="204">구조화 JSON 응답 강제</text>
  </g>
  <rect x="528" y="230" width="150" height="18" rx="9" fill="#E6F5F3"/>
  <text x="603" y="243" font-size="10.5" font-weight="700" fill="#0E8074" text-anchor="middle">로컬 모드: 외부 전송 없음</text>

  <path d="M742 150l-16-8v5h-10v6h10v5z" fill="#B9C4D6"/>

  <!-- STEP 4: 결과 카드 -->
  <rect x="750" y="44" width="146" height="212" rx="14" fill="#FFFFFF" stroke="#E2E7EF" filter="url(#sh)"/>
  <rect x="770" y="64" width="40" height="40" rx="13" fill="#FBE9EA"/>
  <rect x="779" y="73" width="22" height="6" rx="3" fill="#E5484D"/>
  <rect x="779" y="83" width="16" height="5" rx="2.5" fill="#F0A6A9"/>
  <rect x="779" y="92" width="19" height="5" rx="2.5" fill="#F0A6A9"/>
  <circle cx="876" cy="64" r="11" fill="#E7EFFB"/>
  <text x="876" y="68.5" font-size="11" font-weight="750" fill="#0A57D0" text-anchor="middle">4</text>
  <text x="770" y="134" font-size="14.5" font-weight="750" fill="#0B1B33">결과 카드</text>
  <g font-size="11.5" fill="#3D4E66">
    <circle cx="775" cy="156" r="2" fill="#E5484D"/><text x="784" y="160">D-day · 조치 · 주의</text>
    <circle cx="775" cy="178" r="2" fill="#E5484D"/><text x="784" y="182">결재 검토 리포트</text>
    <circle cx="775" cy="200" r="2" fill="#E5484D"/><text x="784" y="204">복사 · .md 저장</text>
  </g>
</svg>
